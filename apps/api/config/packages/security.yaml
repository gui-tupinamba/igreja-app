security:
    password_hashers:
        App\Entity\User: auto

    providers:
        app_users:
            entity:
                class: App\Entity\User
                property: emailNormalized

    firewalls:
        api:
            pattern: ^/api(?:/|$)
            stateless: true
            provider: app_users

            custom_authenticators:
                - App\Security\BearerAuthenticator

            entry_point: App\Security\BearerAuthenticator

    access_control:
        - { path: ^/api/(health|ready)$, roles: PUBLIC_ACCESS, methods: [GET, HEAD] }

        - { path: ^/api/auth/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/refresh$, roles: PUBLIC_ACCESS }

        - { path: ^/api(?:/|$), roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10