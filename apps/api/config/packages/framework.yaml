framework:
    secret: '%env(APP_SECRET)%'
    handle_all_throwables: true
    http_method_override: false
    # Origin ports are bound to loopback; cloudflared is the external entry point.
    # Never expose these ports publicly while trusting the immediate proxy.
    trusted_proxies: '127.0.0.1,REMOTE_ADDR'
    trusted_headers: ['x-forwarded-proto']
    php_errors:
        log: true
    router:
        utf8: true

when@test:
    framework:
        test: true
