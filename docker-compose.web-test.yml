services:
  php-web-test:
    extends:
      file: docker-compose.yml
      service: api-test
    environment:
      AUTH_ALLOWED_ORIGINS: http://127.0.0.1:5174
      AUTH_ALLOW_INSECURE_LOCAL: '1'
    command: [sh, -c, 'php tests/generate-keys.php && php bin/console doctrine:migrations:migrate --no-interaction && php bin/console cache:warmup --no-debug && php-fpm']
    volumes:
      - ./apps/web/tests/fixtures.php:/var/www/api/tests/web-fixtures.php:ro
    healthcheck:
      test: [CMD, sh, /usr/local/bin/check-fpm]
      interval: 5s
      timeout: 3s
      retries: 12
  nginx-web-test:
    profiles: [tools]
    image: nginx:1.30-alpine
    ports: ['127.0.0.1:8081:80']
    volumes:
      - ./docker/nginx/web-test.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php-web-test:
        condition: service_healthy
    networks: [test_database, edge]
