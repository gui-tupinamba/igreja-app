date.timezone = UTC
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 256M
max_execution_time = 30
upload_max_filesize = 10M
post_max_size = 12M
opcache.enable = 1
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
