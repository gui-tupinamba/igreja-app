map $uri $api_cache_control {
    default "no-store, private";

    ~^/api/posts/[0-9]+/images/[0-9]+(/(full|detail|feed))?$ "private, no-cache, must-revalidate";
    ~^/api/events/[0-9]+/images/[0-9]+(/(full|detail|feed))?$ "private, no-cache, must-revalidate";
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    return 404;
}

server {
    listen 80;
    server_name localhost 127.0.0.1 api.guitupinamba.dev;
    server_tokens off;
    default_type application/json;
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control $api_cache_control always;

    # No query string, cookies or Authorization header in access logs.
    access_log off;
    error_log /var/log/nginx/error.log warn;

    location ~ (^|/)\. {
        return 404 '{"error":{"code":"NOT_FOUND","message":"Recurso não encontrado."}}';
    }

    location /api/ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/api/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 40s;
        fastcgi_hide_header Cache-Control;
    }

    location / {
        return 404 '{"error":{"code":"NOT_FOUND","message":"Recurso não encontrado."}}';
    }
}
